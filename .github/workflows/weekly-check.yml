# BursaSearch Weekly Check: views (TikTok + Instagram) -> clicks (IG link taps,
# Google, site visits) -> installs + purchases (App Store) -> the in-app funnel
# and the A/B test, and what to do next. Commits AdFactory/native/reports/ to the
# PRIVATE repo; Isaac's laptop copies reports/latest.html into bursa_project.
#
# Runs here because public repos get free minutes (2026-10-26: the private repo's
# ran out). THE LOGS ARE PUBLIC and this report holds sales numbers, so the
# script's output never reaches the log: it goes to reports/last_run.log in the
# private repo instead.
name: Weekly check

on:
  schedule:
    - cron: "0 6 * * 1"      # Mondays ~07:00 London
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: native-daily         # never overlaps a posting run (shares the posted.json log)
  cancel-in-progress: false

# rotated TikTok/Instagram tokens are written back to both repos (tiktok_draft.save_secret)
env:
  SECRETS_REPO: BursaSearchp/bursa-ads-runner,BursaSearchp/bursa-project
  SECRETS_TOKEN: ${{ secrets.SECRETS_TOKEN }}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # the deploy key was stored from Windows (CRLF), which ssh can't load - strip it
      - name: Check out the private repo (code + data live there, never here)
        env:
          KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && python3 -c "import os; open(os.path.expanduser('~/.ssh/deploy'), 'w').write(os.environ['KEY'].replace(chr(13), '').strip() + chr(10))" && chmod 600 ~/.ssh/deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/deploy -o IdentitiesOnly=yes"
          git clone -q --depth 1 -b master git@github.com:BursaSearchp/bursa-project.git .
          git config core.sshCommand "$GIT_SSH_COMMAND"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests pynacl pillow "pyjwt[crypto]" google-auth
      - name: Build report (output kept out of this public log)
        working-directory: AdFactory/native
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          WEB_PUSH_TOKEN: ${{ secrets.WEB_PUSH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_SITE_TAG: ${{ secrets.CF_SITE_TAG }}
        run: |
          mkdir -p reports
          set +e
          python weekly_check.py > reports/last_run.log 2>&1
          code=$?
          set -e
          if [ $code -eq 0 ]; then echo "Report built."; else echo "::error::weekly_check.py failed (exit $code) - see AdFactory/native/reports/last_run.log in bursa-project"; fi
          echo "code=$code" >> "$GITHUB_ENV"
      - name: Save report to the private repo
        run: |
          git config user.name "ads-bot"
          git config user.email "actions@users.noreply.github.com"
          git add AdFactory/native/reports
          git commit -q -m "chore: weekly check [skip ci]" || exit 0
          git pull -q --rebase origin master || true
          git push -q
          exit "${code:-0}"
